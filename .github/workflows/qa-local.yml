name: QA sin credenciales
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-local.yml'
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck

# Repetición QA: entorno MCP restringido.
